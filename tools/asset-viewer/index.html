<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Asset Inspection Gallery — Big Hero 6: Fractured</title>
    <style>
      :root { color-scheme: dark; --bg: #23252b; --panel: #17191e; --panel2: #1d2026; --line: rgb(255 255 255 / 9%); --text: #d9dde6; --muted: #8a92a3; --accent: #8fb4ff;
        --approved: #6fd39b; --wip: #e8c36a; --missing: #ff8a7a; --info: #a99cff; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, 'Segoe UI', sans-serif; overflow: hidden; }
      #app { display: grid; grid-template-columns: 270px 1fr 310px; height: 100%; }
      aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
      aside.inspector { border-right: 0; border-left: 1px solid var(--line); padding: 12px 14px 24px; }
      header.brand { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
      header.brand h1 { margin: 0; font-size: 14px; letter-spacing: .04em; }
      header.brand .sub { color: var(--muted); font-size: 11px; margin: 2px 0 8px; }
      input[type=search] { width: 100%; font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; }
      .toolbar { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
      button { font: inherit; font-size: 12px; color: var(--text); background: rgb(255 255 255 / 6%); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; cursor: pointer; }
      button:hover { border-color: rgb(255 255 255 / 25%); }
      button[aria-pressed="true"] { border-color: var(--accent); color: #fff; background: rgb(143 180 255 / 14%); }
      details.cat { border-bottom: 1px solid var(--line); }
      details.cat > summary { cursor: pointer; padding: 7px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
      details.cat > summary::-webkit-details-marker { display: none; }
      .item { display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 20px; cursor: pointer; }
      .item:hover { background: rgb(255 255 255 / 4%); }
      .item[aria-selected="true"] { background: rgb(143 180 255 / 13%); }
      .item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .item .meta { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
      .badge { display: inline-block; font-size: 10px; line-height: 1; padding: 3px 5px; border-radius: 3px; border: 1px solid currentColor; text-transform: uppercase; letter-spacing: .05em; }
      .badge.candidate { color: #7fd0ff; } .badge.approved { color: var(--approved); } .badge.wip { color: var(--wip); } .badge.missing, .badge.failed { color: var(--missing); }
      .badge.unregistered, .badge.shader, .badge.notplanned, .badge.layout, .badge.procedural { color: var(--info); }
      main { position: relative; overflow: hidden; }
      #stage { position: absolute; inset: 0; }
      #stage.narrow { right: 46%; }
      #labels { position: absolute; inset: 0; pointer-events: none; }
      #labels span { position: absolute; transform: translate(-50%, 0); font-size: 11px; color: #fff; background: rgb(0 0 0 / 45%); padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
      #status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; text-align: center; padding: 20px; }
      #status.error { color: var(--missing); }
      .hud { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 11px; }
      .hud b { color: var(--text); font-weight: 500; }
      #refpane { position: absolute; top: 0; right: 0; bottom: 0; width: 46%; background: #111317; border-left: 1px solid var(--line); display: none; flex-direction: column; }
      #refpane.open { display: flex; }
      #refpane header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 12px; }
      #refpane header span { flex: 1; color: var(--muted); }
      #refpane .img { flex: 1; overflow: auto; cursor: zoom-in; }
      #refpane .img img { width: 100%; display: block; }
      #refpane .img.zoom { cursor: zoom-out; } #refpane .img.zoom img { width: 220%; }
      #sheet { position: absolute; inset: 0; background: var(--bg); overflow-y: auto; display: none; padding: 14px; z-index: 5; }
      #sheet.open { display: block; }
      #sheet .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
      #sheet figure { margin: 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; cursor: pointer; }
      #sheet figure img { width: 100%; display: block; aspect-ratio: 4 / 3; object-fit: cover; background: #2b2d33; }
      #sheet figcaption { padding: 6px 8px; font-size: 11px; display: flex; justify-content: space-between; gap: 6px; }
      #sheet h2 { margin: 0 0 10px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
      .section { margin-top: 14px; }
      .section > .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
      .row { display: flex; flex-wrap: wrap; gap: 5px; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-size: 12px; }
      dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
      .mat { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 2px 0; }
      .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); flex: none; }
      .comp { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 0; }
      .comp label { flex: 1; cursor: pointer; }
      .refs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .refs img { width: 100%; border-radius: 4px; border: 1px solid var(--line); cursor: pointer; display: block; }
      .note { color: var(--muted); font-size: 11px; margin-top: 6px; }
      h2.title { margin: 0; font-size: 15px; } .file { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; margin: 3px 0 6px; }
      body.capture aside, body.capture .hud { display: none; } body.capture #app { display: block; } body.capture main { position: fixed; inset: 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside aria-label="Asset catalogue">
        <header class="brand">
          <h1>Asset Inspection Gallery</h1>
          <div class="sub">Big Hero 6: Fractured · the real models used in the dimension</div>
          <input type="search" id="search" placeholder="Filter assets…" aria-label="Filter assets" />
          <div class="toolbar">
            <button type="button" id="refresh" title="Re-read manifest.json and references">Refresh catalogue</button>
            <button type="button" id="contact">Contact sheet</button>
          </div>
        </header>
        <nav id="catalogue"></nav>
      </aside>
      <main>
        <div id="stage"></div>
        <div id="labels"></div>
        <div id="status" role="status">Loading catalogue…</div>
        <div class="hud" id="hud"></div>
        <section id="refpane" aria-label="Reference image">
          <header><span id="reftitle"></span><button type="button" id="refprev">◀</button><button type="button" id="refnext">▶</button><button type="button" id="refclose">Close</button></header>
          <div class="img" id="refimg"><img alt="Reference sheet" /></div>
        </section>
        <section id="sheet" aria-label="Contact sheet">
          <h2><span id="sheettitle">Contact sheet</span><button type="button" id="sheetclose">Close</button></h2>
          <div class="grid" id="sheetgrid"></div>
        </section>
      </main>
      <aside class="inspector" aria-label="Inspector">
        <span class="badge" id="badge"></span>
        <h2 class="title" id="title">—</h2>
        <div class="file" id="file"></div>
        <div class="section"><div class="label">View</div><div class="row" id="views"></div></div>
        <div class="section"><div class="label">Shading</div>
          <div class="row" id="modes">
            <button type="button" data-mode="material" aria-pressed="true">Material</button>
            <button type="button" data-mode="clay">Clay</button>
            <button type="button" data-mode="wire">Wireframe</button>
            <button type="button" data-mode="dimension" title="The in-game asset shader under the dimension's light rig">Dimension</button>
          </div>
          <div class="note" id="modenote"></div>
        </div>
        <div class="section"><div class="row">
          <button type="button" id="spin" aria-pressed="false">Auto-rotate</button>
          <button type="button" id="grid" aria-pressed="true">Metric grid</button>
          <button type="button" id="play" aria-pressed="false" title="Run the in-game model-time motion (Dimension mode)">Motion</button>
          <button type="button" id="refbtn">References</button>
        </div></div>
        <div class="section"><div class="label">Statistics (measured from what is rendered)</div><dl id="stats"></dl></div>
        <div class="section" id="matsec"><div class="label">Materials</div><div id="materials"></div></div>
        <div class="section" id="compsec"><div class="label">Components (glTF primitives)</div><div id="components"></div></div>
        <div class="section" id="valsec"><div class="label">Validation</div><dl id="validation"></dl></div>
        <div class="section" id="regsec"><div class="label">Scale registry</div><dl id="registry"></dl></div>
        <div class="section" id="refsec"><div class="label">Reference sheets</div><div class="refs" id="refs"></div></div>
      </aside>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
